[package]
name = "roadie"
version = "0.1.0"
description = "Roadie — installs, configures and runs the tools your apps need"
authors = ["outcast1000"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "roadie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two releases from one crate:
# - desktop (default features): the Tauri window, the service with its local
#   API and owner channel, and the MCP server it bundles.
# - CLI (`--no-default-features`): one standalone binary that does everything
#   in-process and asks the user in a native dialog (`src/cli/local.rs`).
[features]
default = ["window"]
service = ["dep:axum", "dep:tokio"]
window = [
  "service",
  "dep:tauri-build",
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["devtools"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
# OS entropy for the API bearer token and tool secrets — the minimal primitive
# rather than the full rand crate.
getrandom = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
